[package]
name = "remit-engine-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Holder-hosted Python kernel engine (Monty interpreter, remit:kernel world)"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
monty = "=1.6.0"
monty-types = "=1.6.0"
ciborium = "0.2"
serde_json = "1"
arrow-ipc = { version = "59", default-features = false }
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
