[package]
name = "remit-kernel"
description = "Remit compute plane: Wasmtime host for kernel engines (pooling, fuel, deterministic WASI stubs, worker processes)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["remit", "wasm", "wasmtime", "sandbox"]
categories = ["wasm"]

[dependencies]
remit-wire = { workspace = true }
wasmtime = { workspace = true, features = ["call-hook"] }
wasmtime-wasi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = "0.1"
tracing = { workspace = true }
base64 = { workspace = true }
libc = "0.2"
rand10 = { package = "rand", version = "0.10", default-features = false }
parking_lot = { workspace = true }
lru = { workspace = true }
wasmtime-wizer = { version = "=48.0.10", default-features = false, features = ["component-model"] }

[dev-dependencies]
remit-read = { workspace = true }
datafusion = { workspace = true }

[lints]
workspace = true
