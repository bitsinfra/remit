[project]
name = "remit-native"
version = "0.1.0"
description = "Rust verifier core for the Remit Python SDK: JCS, remit_id, capacity, validation, SQL profile"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["remit", "agents", "verifier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/bitsinfra/remit"
Source = "https://github.com/bitsinfra/remit/tree/main/crates/remit-py"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "remit_native"
features = []
