[package]
name = "remit-receipt"
description = "Remit receipts: DSSE-signed run records, label meet, hash-chained append-only log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["remit", "receipts", "merkle", "transparency-log", "audit"]
categories = ["cryptography"]

[dependencies]
ciborium = { workspace = true }
base64 = { workspace = true }
p384 = { version = "0.14", features = ["ecdsa"] }
x509-cert = { version = "0.2", features = ["std"] }
remit-wire = { workspace = true, features = ["crypto"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
chrono = { workspace = true }

[lints]
workspace = true
