name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: Run containing the previously built native wheels
        required: true
        type: string
      python_package:
        description: Python distribution to publish
        required: true
        type: choice
        options: [native, sdk]

# Publishing needs repository secrets CARGO_REGISTRY_TOKEN and NPM_TOKEN, a
# `release` environment, and a PyPI trusted publisher for this workflow on the
# `remit-protocol` and `remit-native` projects. The Go module is released by pushing a
# `sdk/go/vX.Y.Z` tag.

permissions:
  contents: write
  id-token: write      # keyless sigstore signing
  attestations: write  # SLSA build provenance

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "wasm32-wasip2,wasm32-unknown-unknown,${{ matrix.target }}" }
      - name: Protocol Buffers compiler
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          else
            brew install protobuf
          fi
      - name: Reproducible build, twice, in different directories
        run: scripts/reproducible-build.sh ${{ matrix.target }} out
      - name: SBOM (CycloneDX)
        run: cargo install cargo-cyclonedx --locked && cargo cyclonedx --format json --manifest-path crates/remit-cli/Cargo.toml && cp crates/remit-cli/*.cdx.json out/
      - uses: sigstore/cosign-installer@v3
      - name: Package target artifacts
        run: |
          mkdir -p release
          tar -czf "release/remit-${{ matrix.target }}.tar.gz" -C out .
          rm -rf out
          mv release out
      - name: Sign (keyless) and write checksums
        run: |
          cd out && (sha256sum *.tar.gz 2>/dev/null || shasum -a 256 *.tar.gz) > "SHA256SUMS-${{ matrix.target }}"
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "out/*" }
      - uses: actions/upload-artifact@v4
        with: { name: "remit-${{ matrix.target }}", path: out }

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "remit-*", path: dist }
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft dist/*/*
        env: { GH_TOKEN: "${{ github.token }}" }

  # Registry jobs run in the `release` environment so they can require approval.

  crates:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Publish every publishable crate in dependency order
        run: cargo publish --workspace --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  npm:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: Check whether this npm version is already published
        id: npm-version
        working-directory: sdk/ts
        run: |
          package=$(node -p '`${require("./package.json").name}@${require("./package.json").version}`')
          if npm view "$package" version; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.npm-version.outputs.published != 'true'
        with: { targets: "wasm32-unknown-unknown" }
      - run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
        if: steps.npm-version.outputs.published != 'true'
      - run: scripts/build-verifier.sh
        if: steps.npm-version.outputs.published != 'true'
      - run: cd sdk/ts && npm ci && npm publish --provenance --access public
        if: steps.npm-version.outputs.published != 'true'
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  python-native:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15, target: x86_64 }
          - { os: windows-2025, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/remit-py
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with: { name: "wheels-${{ matrix.os }}-${{ matrix.target }}", path: crates/remit-py/dist }

  python:
    needs: [build, python-native]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.build.result == 'success' && needs.python-native.result == 'success'))
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: read, actions: read, id-token: write }  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: PyO3/maturin-action@v1
        if: github.event_name == 'push' || inputs.python_package == 'native'
        with: { working-directory: crates/remit-py, command: sdist, args: --out dist }
      - run: python -m pip install build && python -m build sdk/python --outdir sdk/python/dist
        if: github.event_name == 'push' || inputs.python_package == 'sdk'
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' || inputs.python_package == 'native'
        with:
          pattern: wheels-*
          path: crates/remit-py/dist
          merge-multiple: true
          run-id: ${{ inputs.wheel_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish remit-native
        if: github.event_name == 'push' || inputs.python_package == 'native'
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: crates/remit-py/dist, skip-existing: true }
      - name: Publish remit-protocol
        if: github.event_name == 'push' || inputs.python_package == 'sdk'
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: sdk/python/dist, skip-existing: true }
